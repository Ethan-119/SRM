# 本地开发环境：直连本机服务（localhost）
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/SRM
    username: postgres
    password: 123456
    hikari:
      pool-name: Postgres
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 15
      client-name: Redis
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  rabbitmq:
    # 本地若没装 RabbitMQ，可指回远端 121.197.0.85
    host: 121.197.0.85
    port: 5672
    username: admin
    password: Rabbit@123

srm:
  neo4j:
    uri: bolt://localhost:7687
    username: neo4j
    password: neo4j123456
    database: neo4j
    sync-on-startup: false
  pgvector:
    url: jdbc:postgresql://localhost:5432/SRM
    username: postgres
    password: 123456
    table: vector_store
    dimension: 1024
    top-k: 20

logging:
  level:
    com.srm: debug
