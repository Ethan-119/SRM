spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/SRM
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    hikari:
      pool-name: Postgres

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # ACL 场景设置 REDIS_USERNAME；默认留空，对应仅 requirepass 的 Redis
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:15}
      client-name: Redis

  ai:
    openai:
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen3-flash}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v4}

srm:
  agent:
    # Redis 短期记忆窗口（最近 N 条消息），长期记忆在 PG srm_agent_message 表
    history-window: ${AGENT_HISTORY_WINDOW:20}
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_PORT:7687}
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:123456}
    database: ${NEO4J_DATABASE:neo4j}
  pgvector:
    url: jdbc:postgresql://${PGVECTOR_HOST:localhost}:${PGVECTOR_PORT:5432}/${PGVECTOR_DB:SRM}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:123456}
    table: ${PGVECTOR_TABLE:vector_store}
    dimension: ${PGVECTOR_DIMENSION:1024}
    top-k: ${PGVECTOR_TOPK:20}

logging:
  level:
    com.srm: info
