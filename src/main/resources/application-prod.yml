spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/srm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      pool-name: Mysql

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # ACL 场景设置 REDIS_USERNAME；默认留空，对应仅 requirepass 的 Redis
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:15}
      client-name: Redis

logging:
  level:
    com.srm: info
