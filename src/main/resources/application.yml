server:
  port: 8083

spring:
  application:
    name: srm

  profiles:
    # 默认 dev（本地直接跑）；线上/容器通过 SPRING_PROFILES_ACTIVE=prod 或 --spring.profiles.active=prod 切换
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

  ai:
    openai:
      # DashScope 兼容 OpenAI 协议（dev / prod 共用同一云端 API）
      # 注意：Spring AI 1.0 默认补全路径为 /v1/chat/completions、embedding 为 /v1/embeddings，
      # 因此 base-url 不能以 /v1 结尾，否则会出现 /v1/v1/chat/completions 的 404。
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen3.7-flash}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v4}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

srm:
  agent:
    # Redis 短期记忆窗口（最近 N 条消息），长期记忆在 PG srm_agent_message 表
    history-window: ${AGENT_HISTORY_WINDOW:20}
  neo4j:
    # 启动时是否灌入图谱种子数据（SUPPLIES 供应关系，HHI 集中度分析依赖；一次性、幂等；默认关闭）
    # 首次部署可临时置 true，跑完改回 false
    seed-on-startup: ${NEO4J_SEED_ON_STARTUP:false}
  rag:
    # 启动时是否把演示文档向量化灌入 pgvector（一次性灌库，幂等；默认关闭）
    ingest-on-startup: ${RAG_INGEST_ON_STARTUP:false}
    # 文件导入时，单块文本的最大字符数（超长文本按段落/句子边界切分）
    chunk-size: ${RAG_CHUNK_SIZE:800}

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
